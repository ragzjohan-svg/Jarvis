  var s=document.createElement('script');s.src=BACKEND+'?action=getGallery&id='+encodeURIComponent(id)+'&callback=gcb';
  s.onerror=function(){msg('Photos are not available right now. Please try again shortly.');};
  document.head.appendChild(s);
})();
function buildGrid(){var g=document.getElementById('grid');if(g.children.length)return;
  P.forEach(function(id,i){var d=document.createElement('div');var im=new Image();im.loading='lazy';im.src=img(id,360);im.onclick=function(){openLb(i);};d.appendChild(im);g.appendChild(d);});}
function openLb(i){buildGrid();document.getElementById('lb').style.display='block';show(i);}
function closeLb(){document.getElementById('lb').style.display='none';}
function show(i){cur=(i+P.length)%P.length;document.getElementById('li').src=img(P[cur],1400);
  document.getElementById('lc').textContent=(cur+1)+' / '+P.length;
  [cur+1,cur-1].forEach(function(k){var j=(k+P.length)%P.length;new Image().src=img(P[j],1400);});}
function step(d){show(cur+d);}
var x0=null;var lb=document.getElementById('lb');
lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)step(dx<0?1:-1);});
document.addEventListener('keydown',function(e){if(lb.style.display!=='block')return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Escape')closeLb();});
</script></body></html>
