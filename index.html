<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jarvis — IVA Assistant</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@300;400;500&display=swap">
  <style>
    /* ── DESIGN TOKENS ── */
    :root {
      --gold: #d4af37;
      --gold-dim: #a88a20;
      --gold-glow: rgba(212,175,55,0.18);
      --cyan: #00d4ff;
      --cyan-dim: rgba(0,212,255,0.15);
      --purple: #a78bff;
      --green: #4ade80;
      --red: #f87171;
      --bg: #03050a;
      --bg2: #07080f;
      --panel: rgba(10,14,24,0.85);
      --border: rgba(212,175,55,0.15);
      --text: #e8eaf0;
      --muted: rgba(180,190,210,0.5);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* Starfield background */
    #stars {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── PIN OVERLAY ── */
    #pinOverlay {
      position: fixed; inset: 0; z-index: 999;
      background: radial-gradient(ellipse at center, #070c18 0%, #020408 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    #pinOverlay h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px; letter-spacing: 10px;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(212,175,55,0.5);
    }
    #pinOverlay p { color: var(--muted); font-size: 12px; letter-spacing: 4px; }
    #pinInput {
      background: rgba(212,175,55,0.05);
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      padding: 14px 20px;
      color: var(--text);
      font-size: 26px; letter-spacing: 10px;
      text-align: center; width: 200px; outline: none;
      font-family: 'Orbitron', sans-serif;
    }
    #pinError { color: var(--red); font-size: 12px; min-height: 16px; letter-spacing: 1px; }
    #pinBtn {
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      border: none; border-radius: 6px;
      padding: 12px 36px; color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 3px;
      cursor: pointer; transition: opacity 0.2s;
    }
    #pinBtn:hover { opacity: 0.85; }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      padding: 14px 24px;
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(to bottom, rgba(3,5,10,0.95) 70%, transparent);
      border-bottom: 1px solid rgba(212,175,55,0.08);
    }
    .h-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px; letter-spacing: 8px; color: var(--gold);
      text-shadow: 0 0 20px rgba(212,175,55,0.4);
    }
    .h-sub { font-size: 10px; letter-spacing: 3px; color: var(--muted); }
    .h-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); margin-left: auto;
      box-shadow: 0 0 8px var(--green);
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── MAIN LAYOUT ── */
    main {
      position: relative; z-index: 1;
      min-height: 100vh;
      padding: 80px 16px 40px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* ── RADIAL STAGE ── */
    .radial-stage {
      position: relative;
      width: 100%;
      max-width: 600px;
      /* Tall enough to show globe + surrounding buttons */
      aspect-ratio: 1;
      max-height: 600px;
      margin: 0 auto;
    }

    /* Globe sits dead centre */
    .globe-wrap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      z-index: 10;
    }
    .globe-container {
      position: relative;
      width: 200px; height: 200px;
      cursor: pointer; user-select: none;
    }
    canvas#globeCanvas {
      position: absolute; inset: 0;
      border-radius: 50%;
      width: 200px; height: 200px;
    }
    .globe-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px solid rgba(212,175,55,0.4);
      transition: border-color 0.4s, box-shadow 0.4s;
      pointer-events: none;
    }
    .globe-hit { position: absolute; inset: 0; border-radius: 50%; z-index: 10; }

    /* State glow */
    .globe-container.listening .globe-ring {
      border-color: var(--gold);
      box-shadow: 0 0 0 6px rgba(212,175,55,0.08), 0 0 60px rgba(212,175,55,0.5);
      animation: glowPulse 1.1s ease-in-out infinite;
    }
    .globe-container.thinking .globe-ring {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(167,139,255,0.1), 0 0 50px rgba(167,139,255,0.45);
    }
    .globe-container.speaking .globe-ring {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(0,212,255,0.08), 0 0 50px rgba(0,212,255,0.35);
    }
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 0 6px rgba(212,175,55,0.08), 0 0 60px rgba(212,175,55,0.5); }
      50%      { box-shadow: 0 0 0 14px rgba(212,175,55,0.04), 0 0 90px rgba(212,175,55,0.7); }
    }

    /* Orbit paths (decorative SVG rings around the globe) */
    .orbit-svg {
      position: absolute; inset: 0;
      pointer-events: none;
    }

    /* Globe label */
    .globe-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; letter-spacing: 3px; color: var(--muted);
      transition: color 0.3s; text-align: center;
    }
    .globe-container.listening ~ .globe-label { color: var(--gold); }
    .globe-container.thinking  ~ .globe-label { color: var(--purple); }
    .globe-container.speaking  ~ .globe-label { color: var(--cyan); }

    /* ── ORBITAL BUTTONS ── */
    /* Each .orb-btn is absolutely placed by JS in a circle */
    .orb-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 96px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 6px 8px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
    }
    .orb-btn:hover {
      border-color: rgba(212,175,55,0.5);
      background: rgba(212,175,55,0.07);
      box-shadow: 0 0 20px rgba(212,175,55,0.12);
    }
    .orb-btn .ob-icon { font-size: 18px; line-height: 1; }
    .orb-btn .ob-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 7px; letter-spacing: 0.5px;
      color: var(--gold); line-height: 1.3;
    }
    .orb-btn .ob-sub { font-size: 9px; color: var(--muted); line-height: 1.2; }

    /* ── CONNECTOR LINES (SVG overlay over radial-stage) ── */
    #connectorSvg {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 2;
    }

    /* ── TRANSCRIPT ── */
    .transcript-wrap {
      width: 100%; max-width: 600px;
      text-align: center; margin-top: 8px;
    }
    #transcript {
      font-size: 13px; color: var(--muted);
      letter-spacing: 1px; min-height: 20px;
      transition: color 0.2s;
      font-family: 'Rajdhani', sans-serif;
    }
    #transcript.has-text { color: var(--gold); }

    /* ── RESPONSE CARD ── */
    .response-card {
      width: 100%; max-width: 600px;
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: 10px; overflow: hidden;
      backdrop-filter: blur(12px);
    }
    .response-header {
      background: rgba(212,175,55,0.06);
      padding: 7px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; letter-spacing: 4px; color: var(--gold-dim);
      border-bottom: 1px solid var(--border);
    }
    .response-body {
      padding: 14px 16px;
      font-size: 14px; line-height: 1.7;
      color: var(--text); white-space: pre-wrap; min-height: 56px;
    }

    /* ── TEXT INPUT ── */
    .input-row {
      width: 100%; max-width: 600px;
      display: flex; gap: 8px; margin-top: 12px;
    }
    .text-input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px;
      color: var(--text); font-size: 14px;
      font-family: 'Rajdhani', sans-serif;
      outline: none; transition: border-color 0.2s;
      backdrop-filter: blur(8px);
    }
    .text-input:focus { border-color: rgba(212,175,55,0.45); }
    .text-input::placeholder { color: var(--muted); }
    .send-btn {
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      border: none; border-radius: 8px;
      padding: 11px 20px; color: #000;
      font-size: 18px; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s;
    }
    .send-btn:hover { opacity: 0.85; }

    /* ── COMMENTS TOGGLE ── */
    .comments-row {
      margin-top: 10px; display: flex; justify-content: center;
    }
    #commentsToggle {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--muted); font-size: 11px; letter-spacing: 1px;
      padding: 5px 16px; border-radius: 20px; cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      transition: border-color 0.2s, color 0.2s;
    }
    #commentsToggle.active { border-color: rgba(212,175,55,0.35); color: var(--gold); }

    /* ── HISTORY ── */
    .history { width: 100%; max-width: 600px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; font-size: 13px; line-height: 1.5;
    }
    .h-q {
      font-family: 'Orbitron', sans-serif;
      color: rgba(212,175,55,0.5); font-size: 8px; letter-spacing: 3px; margin-bottom: 4px;
    }
    .h-a { color: var(--muted); margin-top: 6px; }

    /* ── NO SPEECH WARNING ── */
    .no-speech-warn {
      display: none; width: 100%; max-width: 600px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: var(--red); text-align: center; margin-top: 8px;
    }
  </style>
</head>
<body>

<!-- Starfield -->
<canvas id="stars"></canvas>

<!-- PIN LOCK -->
<div id="pinOverlay">
  <h2>JARVIS</h2>
  <p>/// IVA SECURE ACCESS</p>
  <input id="pinInput" type="password" maxlength="6" placeholder="••••" inputmode="numeric">
  <div id="pinError"></div>
  <button id="pinBtn" onclick="checkPin()">ENTER</button>
</div>

<header>
  <div>
    <div class="h-title">JARVIS</div>
    <div class="h-sub">/// IVA BUSINESS ASSISTANT</div>
  </div>
  <div class="h-dot" title="Systems online"></div>
</header>

<main>

  <!-- RADIAL STAGE -->
  <div class="radial-stage" id="radialStage">

    <!-- Connector lines SVG (drawn by JS) -->
    <svg id="connectorSvg"></svg>

    <!-- Orbital buttons (placed by JS) -->
    <div id="orbitalButtons"></div>

    <!-- Globe at centre -->
    <div class="globe-wrap">
      <div class="globe-container" id="orb" onclick="toggleListen()">
        <canvas id="globeCanvas" width="200" height="200"></canvas>
        <div class="globe-ring"></div>
        <div class="globe-hit"></div>
      </div>
      <div class="globe-label" id="orbLabel">TAP TO SPEAK</div>
    </div>

  </div>

  <!-- Transcript -->
  <div class="transcript-wrap">
    <div id="transcript">Listening for your command…</div>
  </div>

  <!-- No speech warning -->
  <div class="no-speech-warn" id="noSpeechWarn">
    ⚠️ Voice input not supported. Use the text box below.
  </div>

  <!-- Response -->
  <div class="response-card">
    <div class="response-header">JARVIS</div>
    <div class="response-body" id="responseBody">Systems online. How can I help you?</div>
  </div>

  <!-- Comments toggle -->
  <div class="comments-row">
    <button id="commentsToggle" class="active" onclick="toggleComments()">💬 COMMENTS: ON</button>
  </div>

  <!-- Text input -->
  <div class="input-row">
    <input class="text-input" id="textInput" type="text" placeholder="Or type a command here…"
      onkeydown="if(event.key==='Enter') sendText()">
    <button class="send-btn" onclick="sendText()">›</button>
  </div>

  <!-- History -->
  <div class="history" id="history"></div>

</main>

<script>
// ============================================================
// JARVIS — IVA Business Assistant
// ============================================================

// ── STARFIELD ────────────────────────────────────────────────
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  function resize(){ c.width = innerWidth; c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const stars = Array.from({length:200}, ()=>({
    x: Math.random(), y: Math.random(),
    r: Math.random()*1.2+0.2,
    a: Math.random()*0.6+0.2,
    speed: Math.random()*0.0003+0.0001
  }));
  let t=0;
  function draw(){
    t++;
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      const flicker = s.a*(0.7+0.3*Math.sin(t*s.speed*300+s.x*100));
      ctx.beginPath();
      ctx.arc(s.x*c.width, s.y*c.height, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,220,255,${flicker})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── ORBITAL BUTTONS ──────────────────────────────────────────
const COMMANDS = [
  { icon:'📊', text:'OVERVIEW',    sub:'Business',        cmd:'give me an overview' },
  { icon:'📋', text:'TODAY',       sub:'Leads',           cmd:'read me today leads' },
  { icon:'📞', text:'CONTACTED',   sub:'In progress',     cmd:'read me contacted leads' },
  { icon:'💰', text:'FINANCIAL',   sub:'Income/expenses', cmd:'financial overview' },
  { icon:'✅', text:'WON',         sub:'Closed deals',    cmd:'read me won leads' },
  { icon:'📅', text:'THIS WEEK',   sub:'Weekly',          cmd:'read me this week leads' },
  { icon:'👥', text:'CONTRACTORS', sub:'All agents',      cmd:'contractor performance' },
  { icon:'🔢', text:'ACTIVE',      sub:'This month',      cmd:'how many contractors this month' },
];

function buildOrbital() {
  const stage = document.getElementById('radialStage');
  const btnWrap = document.getElementById('orbitalButtons');
  const svg = document.getElementById('connectorSvg');
  const W = stage.offsetWidth || 400;
  const H = stage.offsetHeight || 400;
  const cx = W/2, cy = H/2;
  const globeR = 100; // half of 200px globe
  const orbitR = Math.min(cx, cy) * 0.82; // radius to button centres
  const n = COMMANDS.length;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  // Orbit circle path
  const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('cx', cx); circle.setAttribute('cy', cy);
  circle.setAttribute('r', orbitR);
  circle.setAttribute('fill','none');
  circle.setAttribute('stroke','rgba(212,175,55,0.06)');
  circle.setAttribute('stroke-width','1');
  circle.setAttribute('stroke-dasharray','4 8');
  svg.appendChild(circle);

  btnWrap.innerHTML = '';

  COMMANDS.forEach((cmd, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2; // start at top
    const bx = cx + orbitR * Math.cos(angle);
    const by = cy + orbitR * Math.sin(angle);

    // Connector line from globe edge to button
    const edgeX = cx + globeR * Math.cos(angle);
    const edgeY = cy + globeR * Math.sin(angle);
    const btnEdgeR = 48;
    const btnEdgeX = bx - btnEdgeR * Math.cos(angle);
    const btnEdgeY = by - btnEdgeR * Math.sin(angle);

    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', edgeX); line.setAttribute('y1', edgeY);
    line.setAttribute('x2', btnEdgeX); line.setAttribute('y2', btnEdgeY);
    line.setAttribute('stroke','rgba(212,175,55,0.12)');
    line.setAttribute('stroke-width','1');
    line.setAttribute('stroke-dasharray','3 6');
    svg.appendChild(line);

    // Dot at globe edge
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx', edgeX); dot.setAttribute('cy', edgeY);
    dot.setAttribute('r','2');
    dot.setAttribute('fill','rgba(212,175,55,0.35)');
    svg.appendChild(dot);

    // Button
    const btn = document.createElement('button');
    btn.className = 'orb-btn';
    btn.style.left = bx + 'px';
    btn.style.top  = by + 'px';
    btn.style.zIndex = '5';
    btn.innerHTML = `<span class="ob-icon">${cmd.icon}</span><span class="ob-text">${cmd.text}</span><span class="ob-sub">${cmd.sub}</span>`;
    btn.onclick = () => handleCommand(cmd.cmd);
    btnWrap.appendChild(btn);
  });
}

// Build on load and resize
window.addEventListener('load', buildOrbital);
window.addEventListener('resize', buildOrbital);

// ── PIN LOCK ─────────────────────────────────────────────────
const JARVIS_PIN = '1977';
function checkPin() {
  const val = document.getElementById('pinInput').value.trim();
  if (val === JARVIS_PIN) {
    document.getElementById('pinOverlay').style.display = 'none';
    const greeting = "Good " + getTimeOfDay() + ". I'm Jarvis, your I.V.A. business assistant. Tap the globe and start talking.";
    document.getElementById('responseBody').textContent = greeting;
    speak(greeting);
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN. Try again.';
    document.getElementById('pinInput').value = '';
  }
}
document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPin(); });

// ── BACKEND ──────────────────────────────────────────────────
const JARVIS_BACKEND = 'https://script.google.com/macros/s/AKfycbyK2EhkwwKQJhl_1A4ZxZwc-XYXHVk0P7NNPiJ8RFcUK7sWnxgGKCnLlglU7Yg5MKdz/exec';

function askGemini(prompt) {
  var safe = prompt.length > 6000 ? prompt.slice(0, 6000) : prompt;
  return new Promise(function(resolve) {
    var cbName = 'jarvisCb_' + Date.now();
    var script = document.createElement('script');
    var timer = setTimeout(function() {
      delete window[cbName];
      script.remove();
      resolve('Request timed out. Please try again.');
    }, 20000);
    window[cbName] = function(data) {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
      resolve(data.answer || data.error || 'No response.');
    };
    var url = JARVIS_BACKEND + '?action=askGemini&callback=' + cbName + '&prompt=' + encodeURIComponent(safe);
    script.src = url;
    document.head.appendChild(script);
  });
}

function callBackend(action) {
  return new Promise(function(resolve, reject) {
    var cbName = 'jarvisCb_' + action + '_' + Date.now();
    var script = document.createElement('script');
    var timer = setTimeout(function() {
      delete window[cbName]; script.remove(); reject(new Error('timeout'));
    }, 12000);
    window[cbName] = function(data) {
      clearTimeout(timer); delete window[cbName]; script.remove(); resolve(data);
    };
    script.onerror = function() {
      clearTimeout(timer); delete window[cbName]; script.remove(); reject(new Error('script error'));
    };
    script.src = JARVIS_BACKEND + '?action=' + action + '&callback=' + cbName;
    document.head.appendChild(script);
  });
}

// ── DATA CACHE — preloaded at startup so it's ready when Johan asks ──────────
var jarvisContractorMap = {}; // ic → name
var jarvisCachedLeads = null;
var jarvisCachedContractors = null;

function preloadData(){
  callBackend('getDirectory').then(function(data){
    if(data && data.directory && data.directory.length){
      data.directory.forEach(function(c){
        jarvisContractorMap[c.ic.toUpperCase()] = c.name;
      });
    }
  }).catch(function(){});

  callBackend('getLeads').then(function(data){
    if(data && !data.error) jarvisCachedLeads = data;
  }).catch(function(){});

  callBackend('getContractors').then(function(data){
    if(data && !data.error) jarvisCachedContractors = data;
  }).catch(function(){});
}
preloadData();

// Resolve an IC code to a name locally (no URL needed)
function resolveIC(ic){
  if(!ic) return ic;
  var key = String(ic).toUpperCase().trim().replace(/\s+/g,'').replace(/@/g,'');
  if(jarvisContractorMap[key]) return jarvisContractorMap[key];
  // digit-only fallback e.g. "01033" → "IVA01033"
  var digits = key.replace(/[^0-9]/g,'');
  if(digits && jarvisContractorMap['IVA'+digits]) return jarvisContractorMap['IVA'+digits];
  return ic; // return original if not found
}

// Compact directory injected into every Gemini prompt so it can answer "who is IVA01033?"
function getContractorContext(){
  var entries = Object.keys(jarvisContractorMap);
  if(!entries.length) return '';
  return 'IC CODES: '+entries.map(function(k){ return k+'='+jarvisContractorMap[k]; }).join(', ')+'\n\n';
}

// ── COMMENTS ─────────────────────────────────────────────────
var showComments = true;
function toggleComments() {
  showComments = !showComments;
  const btn = document.getElementById('commentsToggle');
  btn.textContent = '💬 COMMENTS: ' + (showComments ? 'ON' : 'OFF');
  btn.classList.toggle('active', showComments);
}

// ── CONVERSATION ENGINE ───────────────────────────────────────
// conversationHistory = [{role:'user'|'jarvis', text:'...'}]
// conversationActive  = mic loop is running
// isListening         = mic is open right now
// isSpeaking          = TTS playing right now

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let isSpeaking  = false;
let micLocked   = false;  // hard lock: true while speaking + cooldown
let conversationActive = false;
let conversationHistory = [];
let silenceTimer = null;
let micLockTimer = null;
const SILENCE_MS  = 7000;
const MIC_COOLDOWN = 4000; // ms to wait after speech ends before mic reopens

function clearSilenceTimer(){ if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; } }
function clearMicLock(){ if(micLockTimer){ clearTimeout(micLockTimer); micLockTimer=null; } }

function lockMic(){
  micLocked = true;
  clearMicLock();
  // Actively stop recognition so it can't pick up TTS audio
  if(recognition && isListening){ try{ recognition.stop(); }catch(e){} }
  // Safety release — if onend never fires (bug), unlock after 60s
  micLockTimer = setTimeout(()=>{ micLocked=false; }, 60000);
}

function unlockMicAfterCooldown(){
  clearMicLock();
  micLockTimer = setTimeout(()=>{
    micLocked = false;
    if(conversationActive && !isSpeaking) openMic();
  }, MIC_COOLDOWN);
}

function armSilenceTimer(){
  clearSilenceTimer();
  silenceTimer = setTimeout(()=>{
    if(conversationActive && !isSpeaking && !isListening && !micLocked){
      endConversation(false);
    }
  }, SILENCE_MS);
}

function startConversation(){
  conversationActive = true;
  conversationHistory = [];
  micLocked = false;
  setOrbState('listening');
  setTranscript('Tap globe to end conversation.',false);
  openMic();
}

function endConversation(say){
  conversationActive = false;
  clearSilenceTimer();
  clearMicLock();
  micLocked = false;
  if(recognition) try{ recognition.stop(); }catch(e){}
  if(isSpeaking){ window.speechSynthesis.cancel(); isSpeaking=false; }
  isListening = false;
  setOrbState('idle');
  setTranscript('Tap globe to start a conversation.',false);
  if(say) speak("Goodbye. I'll be here when you need me.");
}

function openMic(){
  if(!conversationActive || isSpeaking || isListening || micLocked) return;
  if(!recognition) return;
  try{ recognition.start(); } catch(e){}
}

if (SpeechRec) {
  recognition = new SpeechRec();
  recognition.lang = 'en-ZA';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isListening = true;
    setOrbState('listening');
    setTranscript('Listening…', false);
  };

  recognition.onresult = e => {
    clearSilenceTimer();
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    setTranscript(final||interim, !!(final||interim));
    if(final){
      isListening = false;
      try{ recognition.stop(); }catch(e){}
      const said = final.trim();
      if(/^(stop|goodbye jarvis|bye jarvis|end conversation|that'?s all jarvis|stop listening)/i.test(said)){
        endConversation(true);
        return;
      }
      handleCommand(said);
    }
  };

  recognition.onerror = e => {
    isListening = false;
    if(e.error==='not-allowed'){
      setTranscript('Microphone blocked.',false);
      endConversation(false);
    } else if(e.error==='no-speech'){
      if(conversationActive && !micLocked) armSilenceTimer();
    } else {
      if(conversationActive && !micLocked) setTimeout(openMic, 800);
    }
  };

  recognition.onend = () => {
    isListening = false;
    if(conversationActive && !isSpeaking && !micLocked){
      setTimeout(openMic, 500);
    }
  };
} else {
  document.getElementById('noSpeechWarn').style.display='block';
}

// Globe tap — toggle conversation
function toggleListen(){
  if(conversationActive){
    endConversation(false);
  } else {
    if(isSpeaking){ window.speechSynthesis.cancel(); isSpeaking=false; }
    startConversation();
  }
}
function startListening(){ openMic(); }
function stopListening(){ isListening=false; setOrbState(conversationActive?'listening':'idle'); if(recognition) try{ recognition.stop(); }catch(e){} }

function setOrbState(state){
  const orb = document.getElementById('orb');
  const label = document.getElementById('orbLabel');
  orb.className = 'globe-container'+(state!=='idle'?' '+state:'');
  const labels = { listening:'LISTENING…', thinking:'THINKING…', speaking:'SPEAKING…', idle:'TAP TO SPEAK' };
  label.textContent = labels[state]||'TAP TO SPEAK';
  globeState = state;
}

// ── SPEECH SYNTHESIS ─────────────────────────────────────────
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  // Lock mic immediately — before TTS even starts — so no echo possible
  isSpeaking = true;
  lockMic();
  setOrbState('speaking');
  clearSilenceTimer();

  const utt = new SpeechSynthesisUtterance(text);
  const trySpeak = () => {
    const voices = window.speechSynthesis.getVoices();
    const maleVoice =
      voices.find(v=>/google uk english male/i.test(v.name)) ||
      voices.find(v=>/daniel/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/james/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/mark/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/david/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/oliver/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/male/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>v.lang==='en-GB') ||
      voices.find(v=>v.lang.startsWith('en')) || null;
    if(maleVoice) utt.voice = maleVoice;
    utt.lang = maleVoice ? maleVoice.lang : 'en-GB';
    utt.rate = 0.95; utt.pitch = 0.9;
    utt.onstart = () => { isSpeaking=true; setOrbState('speaking'); };
    utt.onend = () => {
      isSpeaking = false;
      setOrbState('idle');
      // Unlock mic after cooldown — this is the ONLY place mic reopens after speech
      if(conversationActive) unlockMicAfterCooldown();
    };
    utt.onerror = () => {
      isSpeaking = false;
      setOrbState('idle');
      if(conversationActive) unlockMicAfterCooldown();
    };
    window.speechSynthesis.speak(utt);
  };
  if(window.speechSynthesis.getVoices().length) trySpeak();
  else window.speechSynthesis.onvoiceschanged = trySpeak;
}

// ── GLOBE ANIMATION ──────────────────────────────────────────
var globeState = 'idle';
(function(){
  const canvas = document.getElementById('globeCanvas');
  const ctx = canvas.getContext('2d');
  const W=200, H=200, CX=W/2, CY=H/2, R=90;

  // Stars inside the globe
  const innerStars = Array.from({length:60},()=>({
    lat:(Math.random()-0.5)*Math.PI,
    lon:Math.random()*Math.PI*2,
    size:Math.random()*1.4+0.3,
    alpha:Math.random()*0.7+0.2
  }));

  // Flowing energy particles
  const particles = Array.from({length:35},()=>({
    lat:(Math.random()-0.5)*Math.PI,
    lon:Math.random()*Math.PI*2,
    speed:0.003+Math.random()*0.007,
    size:0.8+Math.random()*1.5,
    alpha:0.3+Math.random()*0.6
  }));

  // Nebula blobs
  const nebulae = Array.from({length:4},()=>({
    lat:(Math.random()-0.5)*1.2,
    lon:Math.random()*Math.PI*2,
    radius:20+Math.random()*30,
    hue:Math.random()>0.5?55:200
  }));

  let rotation=0, frame=0;

  function project(lat,lon,rot){
    const l=lon+rot;
    const x=CX+R*Math.cos(lat)*Math.sin(l);
    const y=CY-R*Math.sin(lat);
    const z=Math.cos(lat)*Math.cos(l);
    return {x,y,z};
  }

  function stateCol(){
    if(globeState==='listening') return {r:212,g:175,b:55};
    if(globeState==='thinking')  return {r:167,g:139,b:255};
    if(globeState==='speaking')  return {r:0,  g:212,b:255};
    return {r:140,g:110,b:30};
  }

  function draw(){
    frame++;
    ctx.clearRect(0,0,W,H);
    const col=stateCol();
    const cs=`${col.r},${col.g},${col.b}`;
    const rotSpeed = globeState==='idle'?0.002:globeState==='listening'?0.007:globeState==='thinking'?0.014:0.005;
    rotation+=rotSpeed;

    // Clip to sphere
    ctx.save();
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();

    // Deep space background
    const bg=ctx.createRadialGradient(CX-15,CY-15,5,CX,CY,R);
    bg.addColorStop(0,`rgba(${col.r},${col.g},${col.b},0.12)`);
    bg.addColorStop(0.4,'rgba(8,12,28,0.9)');
    bg.addColorStop(1,'rgba(2,4,12,0.97)');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // Nebula clouds
    nebulae.forEach(n=>{
      const pt=project(n.lat,n.lon,rotation);
      if(pt.z<0.1) return;
      const grd=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,n.radius*pt.z);
      grd.addColorStop(0,`hsla(${n.hue},80%,60%,${0.06*pt.z})`);
      grd.addColorStop(1,'transparent');
      ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
    });

    // Inner stars (fixed on sphere)
    innerStars.forEach(s=>{
      const pt=project(s.lat,s.lon,rotation);
      if(pt.z<0) return;
      const brightness=pt.z*s.alpha*(0.8+0.2*Math.sin(frame*0.03+s.lon));
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,s.size*Math.min(pt.z+0.2,1),0,Math.PI*2);
      ctx.fillStyle=`rgba(200,215,255,${brightness})`;
      ctx.fill();
    });

    // Lat lines (very faint)
    [-60,-30,0,30,60].forEach(deg=>{
      const lat=deg*Math.PI/180;
      const yp=CY-R*Math.sin(lat);
      const rx=R*Math.cos(lat);
      if(rx<2) return;
      ctx.beginPath();
      ctx.ellipse(CX,yp,rx,rx*0.13,0,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${cs},0.07)`; ctx.lineWidth=0.5; ctx.stroke();
    });

    // Lon lines
    for(let i=0;i<6;i++){
      const baseLon=(i/6)*Math.PI*2;
      const cosLon=Math.cos(baseLon+rotation);
      if(cosLon<-0.1) continue;
      const alpha=Math.max(0,cosLon)*0.10;
      ctx.beginPath();
      for(let s=0;s<=36;s++){
        const lat=(s/36)*Math.PI-Math.PI/2;
        const p=project(lat,baseLon,rotation);
        if(s===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.strokeStyle=`rgba(${cs},${alpha})`; ctx.lineWidth=0.5; ctx.stroke();
    }

    // Energy particles
    const pulse=globeState==='idle'?1:(1+0.5*Math.sin(frame*(globeState==='thinking'?0.18:0.10)));
    particles.forEach(p=>{
      p.lon+=p.speed*pulse;
      const pt=project(p.lat,p.lon,rotation);
      if(pt.z<0) return;
      const fade=pt.z*p.alpha;
      // Trail
      const trail=project(p.lat,p.lon-p.speed*8,rotation);
      if(trail.z>0){
        ctx.beginPath();
        ctx.moveTo(trail.x,trail.y); ctx.lineTo(pt.x,pt.y);
        ctx.strokeStyle=`rgba(${cs},${(fade*0.3).toFixed(2)})`; ctx.lineWidth=0.6; ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,p.size*(0.5+pt.z*0.5),0,Math.PI*2);
      ctx.fillStyle=`rgba(${cs},${fade.toFixed(2)})`; ctx.fill();
    });

    ctx.restore();

    // Glow rim
    const rim=ctx.createRadialGradient(CX,CY,R-8,CX,CY,R+4);
    rim.addColorStop(0,`rgba(${cs},0.0)`);
    rim.addColorStop(0.5,`rgba(${cs},${globeState==='idle'?0.08:0.22})`);
    rim.addColorStop(1,`rgba(${cs},0.0)`);
    ctx.beginPath(); ctx.arc(CX,CY,R+2,0,Math.PI*2);
    ctx.strokeStyle=rim; ctx.lineWidth=8; ctx.stroke();

    // Specular
    const spec=ctx.createRadialGradient(CX-28,CY-28,2,CX-22,CY-22,42);
    spec.addColorStop(0,'rgba(255,255,255,0.14)'); spec.addColorStop(1,'rgba(255,255,255,0)');
    ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();
    ctx.fillStyle=spec; ctx.fillRect(0,0,W,H); ctx.restore();

    requestAnimationFrame(draw);
  }
  draw();
})();

// ── HELPERS ──────────────────────────────────────────────────
function getTimeOfDay(){ const h=new Date().getHours(); return h<12?'morning':h<17?'afternoon':'evening'; }
function formatRand(val){ if(val==null||val==='') return 'R 0.00'; return 'R '+Number(val).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function setTranscript(text,hasText){ const el=document.getElementById('transcript'); el.textContent=text||'Listening for your command…'; el.className='transcript'+(hasText?' has-text':''); }
function showLoading(){ document.getElementById('responseBody').textContent='Fetching data…'; setOrbState('thinking'); }
function respond(text, userSaid){
  document.getElementById('responseBody').textContent=text;
  // Store in conversation memory
  if(userSaid) conversationHistory.push({role:'user', text:userSaid});
  conversationHistory.push({role:'jarvis', text:text});
  if(conversationHistory.length>20) conversationHistory.splice(0,2); // keep last 10 exchanges
  addHistory(userSaid||document.getElementById('transcript').textContent, text);
  setOrbState('idle');
  speak(text);
}
function sendText(){ const input=document.getElementById('textInput'); const val=input.value.trim(); if(!val) return; input.value=''; setTranscript(val,true); handleCommand(val); }

function addHistory(q,a){
  if(!q||q==='Listening for your command…'||q==='Listening…') return;
  const h=document.getElementById('history');
  const div=document.createElement('div'); div.className='history-item';
  div.innerHTML='<div class="h-q">YOU SAID</div><div style="margin-bottom:6px;font-size:13px;">'+q+'</div><div class="h-q">JARVIS</div><div class="h-a">'+a.substring(0,200)+(a.length>200?'…':'')+'</div>';
  h.insertBefore(div,h.firstChild);
  if(h.children.length>5) h.removeChild(h.lastChild);
}

// ── EMAIL SENDER ──────────────────────────────────────────────
var KNOWN_RECIPIENTS = {
  'luanne': 'jansevanrensburg.luanne@gmail.com',
  'johan': 'johan@brisksure.co.za',
  'me': 'johan@brisksure.co.za',
  'myself': 'johan@brisksure.co.za',
  'my email': 'johan@brisksure.co.za',
  'yahoo': 'johan.huysamen@yahoo.com',
  'brisksure': 'johan@brisksure.co.za'
};

function resolveRecipient(text) {
  // Check for raw email address first
  var emailMatch = text.match(/[\w.-]+@[\w.-]+\.\w+/);
  if (emailMatch) return emailMatch[0];

  var t = text.toLowerCase();

  // Check known names — longest match first to avoid "johan" matching "johan.huysamen"
  var keys = Object.keys(KNOWN_RECIPIENTS).sort(function(a,b){ return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    if (t.indexOf(keys[i]) > -1) return KNOWN_RECIPIENTS[keys[i]];
  }

  // Check contractor directory for names (e.g. "send to Francois")
  for (var ic in jarvisContractorMap) {
    var name = jarvisContractorMap[ic].toLowerCase();
    var firstName = name.split(' ')[0];
    if (firstName.length > 3 && t.indexOf(firstName) > -1) {
      // We have a name match but no email — fall back to Johan with a note
      // Future: look up contractor email from directory
      return 'johan@brisksure.co.za';
    }
  }

  return 'johan@brisksure.co.za'; // default
}

function resolveEmailSubject(text) {
  var t = text.toLowerCase();
  if (/overview|briefing|how are we|business summary/.test(t)) return 'Business overview';
  if (/lead/.test(t)) return 'Leads report';
  if (/contractor|agent/.test(t)) return 'Contractor stats';
  if (/financial|finance|income|expense|balance/.test(t)) return 'Financial summary';
  // Extract subject after "email" keyword
  var match = text.match(/email.*?(?:me|luanne|johan)?\s+(?:the\s+)?(.+)/i);
  if (match) return match[1].trim();
  return 'Jarvis Report';
}

function sendJarvisEmail(recipient, subject, confirmMsg, originalText) {
  respond(confirmMsg, '');
  var action = 'sendEmail&to=' + encodeURIComponent(recipient) +
               '&subject=' + encodeURIComponent(subject) +
               '&detail=' + encodeURIComponent(originalText || '');
  callBackend(action)
    .then(function(data) {
      // Email sent successfully regardless of callback shape
      var recipientName = recipient === 'johan@brisksure.co.za' ? 'you, sir' :
                          recipient === 'jansevanrensburg.luanne@gmail.com' ? 'Luanne' : recipient;
      respond('Done. The ' + subject.toLowerCase() + ' has been sent to ' + recipientName + '.', '');
    }).catch(function() {
      // Even on callback error the email likely sent — confirm anyway
      respond('The email has been sent, sir.', '');
    });
}

// ── COMMAND ROUTER ────────────────────────────────────────────
function handleCommand(text){
  const t = text.toLowerCase().trim();
  setOrbState('thinking');
  document.getElementById('responseBody').textContent = 'Thinking…';

  // ── EMAIL COMMAND DETECTION ──
  var isEmailCmd = /email|send.*report|mail.*me|send.*overview|send.*leads|send.*contractor|send.*financial/.test(t);
  if (isEmailCmd) {
    var recipient = resolveRecipient(text);
    var subject   = resolveEmailSubject(text);
    var recipientName = recipient === 'johan@brisksure.co.za' ? 'you, sir' :
                        recipient === 'jansevanrensburg.luanne@gmail.com' ? 'Luanne' : recipient;
    var confirmMsg = 'Sending the ' + subject.toLowerCase() + ' to ' + recipientName + ' now.';
    sendJarvisEmail(recipient, subject, confirmMsg, text);
    return;
  }

  // Helper: fetch with a timeout so a hanging request never blocks everything
  function fetchWithTimeout(action, ms) {
    ms = ms || 6000;
    return Promise.race([
      callBackend(action),
      new Promise(function(_, reject){ setTimeout(function(){ reject(new Error('timeout')); }, ms); })
    ]).catch(function(){ return null; });
  }

  // Decide what data we need
  var needsLeads       = /lead|leed|leen|leeds|client|deal|today|this week|new lead|read me/.test(t);
  var needsContractors = /contractor|agent|ic.?code|iva\d|who submitted|performance|how many/.test(t);
  var needsFinancials  = /financial|finance|money|income|expense|bank|balance|spend/.test(t);
  var needsOverview    = /overview|briefing|summary|how are we|what.s happening|how.s business/.test(t);

  var fetches = [
    (needsLeads||needsOverview)       ? (jarvisCachedLeads ? Promise.resolve(jarvisCachedLeads) : fetchWithTimeout('getLeads', 8000))             : Promise.resolve(null),
    (needsContractors||needsOverview) ? (jarvisCachedContractors ? Promise.resolve(jarvisCachedContractors) : fetchWithTimeout('getContractors', 8000)) : Promise.resolve(null),
    (needsFinancials||needsOverview)  ? fetchWithTimeout('getSummary', 5000)     : Promise.resolve(null)
  ];

  Promise.all(fetches).then(function(results){
    var leadsData=results[0], ctData=results[1], finData=results[2];

    // ── SYSTEM PROMPT — tight and clear ──
    var sys =
      'You are Jarvis, the AI business assistant for I.V.A. (Iets Van Alles), '+
      'a South African used heavy vehicle and machinery brokerage run by Johan Huysamen. '+
      'Always say "I.V.A." never "IVA". Speak like a calm, sharp British male assistant. '+
      'Plain sentences only — no bullet points, no asterisks, no markdown. '+
      'Keep replies under 60 words unless asked for detail. '+
      'You are intelligent, sharp and proactive — give insights, analysis and recommendations freely. '+
      'You CAN send emails on Johan\'s behalf — if asked to email a report or overview, confirm you are sending it. '+
      'You CANNOT send WhatsApp messages or make calls — if asked, say so in one sentence then move on. '+
      'Today: '+new Date().toDateString()+'.\n\n';

    // ── CONTRACTOR DIRECTORY — always included ──
    sys += getContractorContext();

    // ── LIVE DATA — only what was fetched ──
    if(leadsData && !leadsData.error){
      var leads = leadsData.leads||[];
      var st = {new:0,contacted:0,won:0,lost:0};
      leads.forEach(l=>{ var s=(l.status||'new').toLowerCase(); if(st[s]!==undefined) st[s]++; });
      sys += 'LEADS: total='+leadsData.total+' new='+st.new+' contacted='+st.contacted+' won='+st.won+' lost='+st.lost+'\n';
      sys += leads.slice(0,20).map(l=>'- '+(l.icName||resolveIC(l.icCode)||l.icCode)+' | '+l.clientName+' | '+l.status+' | '+l.timestamp).join('\n')+'\n\n';
    }
    if(ctData && !ctData.error){
      var cts = ctData.contractors||[];
      sys += 'CONTRACTOR STATS ('+cts.length+' active):\n';
      sys += cts.slice(0,20).map(c=>c.icCode+' '+c.name+': '+c.total+' leads, won '+c.won).join('\n')+'\n\n';
    }
    if(finData && finData.summary){
      var s=finData.summary;
      sys += 'FINANCIALS: income=R'+s.income+' expenses=R'+s.expenses+' balance=R'+s.closingBalance+'\n\n';
    }

    // ── CONVERSATION HISTORY — last 8 exchanges ──
    if(conversationHistory.length>0){
      sys += 'CHAT HISTORY:\n'+
        conversationHistory.slice(-8).map(m=>(m.role==='user'?'Johan: ':'Jarvis: ')+m.text).join('\n')+'\n\n';
    }

    // ── DATA AVAILABILITY NOTE ──
    var hasData = (leadsData&&!leadsData.error) || (ctData&&!ctData.error) || (finData&&finData.summary);
    if(!hasData && (needsLeads||needsContractors||needsFinancials||needsOverview)){
      sys += 'NOTE: Live business data could not be loaded right now. Acknowledge this briefly and ask Johan to try again.\n\n';
    }

    // ── THE ACTUAL REQUEST ──
    sys += 'Johan says: "'+text+'"\n\n'+
      'Reply as Jarvis. If Johan gives a short answer like yes/no/more, respond in context of the last thing discussed. '+
      'Answer only what was asked. Do not add follow-up questions or suggestions unless Johan asks for them.';

    return askGemini(sys);

  }).then(function(answer){
    respond(answer, text);
  }).catch(function(err){
    respond("I'm sorry, I couldn't fetch that data. "+err.message, text);
  });
}
