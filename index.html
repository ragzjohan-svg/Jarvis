<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jarvis — IVA Assistant</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@300;400;500&display=swap">
  <style>
    /* ── DESIGN TOKENS ── */
    :root {
      --gold: #d4af37;
      --gold-dim: #a88a20;
      --gold-glow: rgba(212,175,55,0.18);
      --cyan: #00d4ff;
      --cyan-dim: rgba(0,212,255,0.15);
      --purple: #a78bff;
      --green: #4ade80;
      --red: #f87171;
      --bg: #03050a;
      --bg2: #07080f;
      --panel: rgba(10,14,24,0.85);
      --border: rgba(212,175,55,0.15);
      --text: #e8eaf0;
      --muted: rgba(180,190,210,0.5);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* Starfield background */
    #stars {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── PIN OVERLAY ── */
    #pinOverlay {
      position: fixed; inset: 0; z-index: 999;
      background: radial-gradient(ellipse at center, #070c18 0%, #020408 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    #pinOverlay h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px; letter-spacing: 10px;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(212,175,55,0.5);
    }
    #pinOverlay p { color: var(--muted); font-size: 12px; letter-spacing: 4px; }
    #pinInput {
      background: rgba(212,175,55,0.05);
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      padding: 14px 20px;
      color: var(--text);
      font-size: 26px; letter-spacing: 10px;
      text-align: center; width: 200px; outline: none;
      font-family: 'Orbitron', sans-serif;
    }
    #pinError { color: var(--red); font-size: 12px; min-height: 16px; letter-spacing: 1px; }
    #pinBtn {
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      border: none; border-radius: 6px;
      padding: 12px 36px; color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 3px;
      cursor: pointer; transition: opacity 0.2s;
    }
    #pinBtn:hover { opacity: 0.85; }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      padding: 14px 24px;
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(to bottom, rgba(3,5,10,0.95) 70%, transparent);
      border-bottom: 1px solid rgba(212,175,55,0.08);
    }
    .h-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px; letter-spacing: 8px; color: var(--gold);
      text-shadow: 0 0 20px rgba(212,175,55,0.4);
    }
    .h-sub { font-size: 10px; letter-spacing: 3px; color: var(--muted); }
    .h-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); margin-left: auto;
      box-shadow: 0 0 8px var(--green);
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── MAIN LAYOUT ── */
    main {
      position: relative; z-index: 1;
      min-height: 100vh;
      padding: 80px 16px 40px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* ── RADIAL STAGE ── */
    .radial-stage {
      position: relative;
      width: 100%;
      max-width: 600px;
      /* Tall enough to show globe + surrounding buttons */
      aspect-ratio: 1;
      max-height: 600px;
      margin: 0 auto;
    }

    /* Globe sits dead centre */
    .globe-wrap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      z-index: 10;
    }
    .globe-container {
      position: relative;
      width: 200px; height: 200px;
      cursor: pointer; user-select: none;
    }
    canvas#globeCanvas {
      position: absolute; inset: 0;
      border-radius: 50%;
      width: 200px; height: 200px;
    }
    .globe-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px solid rgba(212,175,55,0.4);
      transition: border-color 0.4s, box-shadow 0.4s;
      pointer-events: none;
    }
    .globe-hit { position: absolute; inset: 0; border-radius: 50%; z-index: 10; }

    /* State glow */
    .globe-container.listening .globe-ring {
      border-color: var(--gold);
      box-shadow: 0 0 0 6px rgba(212,175,55,0.08), 0 0 60px rgba(212,175,55,0.5);
      animation: glowPulse 1.1s ease-in-out infinite;
    }
    .globe-container.thinking .globe-ring {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(167,139,255,0.1), 0 0 50px rgba(167,139,255,0.45);
    }
    .globe-container.speaking .globe-ring {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(0,212,255,0.08), 0 0 50px rgba(0,212,255,0.35);
    }
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 0 6px rgba(212,175,55,0.08), 0 0 60px rgba(212,175,55,0.5); }
      50%      { box-shadow: 0 0 0 14px rgba(212,175,55,0.04), 0 0 90px rgba(212,175,55,0.7); }
    }

    /* Orbit paths (decorative SVG rings around the globe) */
    .orbit-svg {
      position: absolute; inset: 0;
      pointer-events: none;
    }

    /* Globe label */
    .globe-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; letter-spacing: 3px; color: var(--muted);
      transition: color 0.3s; text-align: center;
    }
    .globe-container.listening ~ .globe-label { color: var(--gold); }
    .globe-container.thinking  ~ .globe-label { color: var(--purple); }
    .globe-container.speaking  ~ .globe-label { color: var(--cyan); }

    /* ── ORBITAL BUTTONS ── */
    /* Each .orb-btn is absolutely placed by JS in a circle */
    .orb-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 96px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 6px 8px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
    }
    .orb-btn:hover {
      border-color: rgba(212,175,55,0.5);
      background: rgba(212,175,55,0.07);
      box-shadow: 0 0 20px rgba(212,175,55,0.12);
    }
    .orb-btn .ob-icon { font-size: 18px; line-height: 1; }
    .orb-btn .ob-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 7px; letter-spacing: 0.5px;
      color: var(--gold); line-height: 1.3;
    }
    .orb-btn .ob-sub { font-size: 9px; color: var(--muted); line-height: 1.2; }

    /* ── CONNECTOR LINES (SVG overlay over radial-stage) ── */
    #connectorSvg {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 2;
    }

    /* ── TRANSCRIPT ── */
    .transcript-wrap {
      width: 100%; max-width: 600px;
      text-align: center; margin-top: 8px;
    }
    #transcript {
      font-size: 13px; color: var(--muted);
      letter-spacing: 1px; min-height: 20px;
      transition: color 0.2s;
      font-family: 'Rajdhani', sans-serif;
    }
    #transcript.has-text { color: var(--gold); }

    /* ── RESPONSE CARD ── */
    .response-card {
      width: 100%; max-width: 600px;
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: 10px; overflow: hidden;
      backdrop-filter: blur(12px);
    }
    .response-header {
      background: rgba(212,175,55,0.06);
      padding: 7px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px; letter-spacing: 4px; color: var(--gold-dim);
      border-bottom: 1px solid var(--border);
    }
    .response-body {
      padding: 14px 16px;
      font-size: 14px; line-height: 1.7;
      color: var(--text); white-space: pre-wrap; min-height: 56px;
    }

    /* ── TEXT INPUT ── */
    .input-row {
      width: 100%; max-width: 600px;
      display: flex; gap: 8px; margin-top: 12px;
    }
    .text-input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px;
      color: var(--text); font-size: 14px;
      font-family: 'Rajdhani', sans-serif;
      outline: none; transition: border-color 0.2s;
      backdrop-filter: blur(8px);
    }
    .text-input:focus { border-color: rgba(212,175,55,0.45); }
    .text-input::placeholder { color: var(--muted); }
    .send-btn {
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      border: none; border-radius: 8px;
      padding: 11px 20px; color: #000;
      font-size: 18px; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s;
    }
    .send-btn:hover { opacity: 0.85; }

    /* ── COMMENTS TOGGLE ── */
    .comments-row {
      margin-top: 10px; display: flex; justify-content: center;
    }
    #commentsToggle {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--muted); font-size: 11px; letter-spacing: 1px;
      padding: 5px 16px; border-radius: 20px; cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      transition: border-color 0.2s, color 0.2s;
    }
    #commentsToggle.active { border-color: rgba(212,175,55,0.35); color: var(--gold); }

    /* ── HISTORY ── */
    .history { width: 100%; max-width: 600px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; font-size: 13px; line-height: 1.5;
    }
    .h-q {
      font-family: 'Orbitron', sans-serif;
      color: rgba(212,175,55,0.5); font-size: 8px; letter-spacing: 3px; margin-bottom: 4px;
    }
    .h-a { color: var(--muted); margin-top: 6px; }

    /* ── NO SPEECH WARNING ── */
    .no-speech-warn {
      display: none; width: 100%; max-width: 600px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: var(--red); text-align: center; margin-top: 8px;
    }
  </style>
</head>
<body>

<!-- Starfield -->
<canvas id="stars"></canvas>

<!-- PIN LOCK -->
<div id="pinOverlay">
  <h2>JARVIS</h2>
  <p>/// IVA SECURE ACCESS</p>
  <input id="pinInput" type="password" maxlength="6" placeholder="••••" inputmode="numeric">
  <div id="pinError"></div>
  <button id="pinBtn" onclick="checkPin()">ENTER</button>
</div>

<header>
  <div>
    <div class="h-title">JARVIS</div>
    <div class="h-sub">/// IVA BUSINESS ASSISTANT</div>
  </div>
  <div class="h-dot" title="Systems online"></div>
</header>

<main>

  <!-- RADIAL STAGE -->
  <div class="radial-stage" id="radialStage">

    <!-- Connector lines SVG (drawn by JS) -->
    <svg id="connectorSvg"></svg>

    <!-- Orbital buttons (placed by JS) -->
    <div id="orbitalButtons"></div>

    <!-- Globe at centre -->
    <div class="globe-wrap">
      <div class="globe-container" id="orb" onclick="toggleListen()">
        <canvas id="globeCanvas" width="200" height="200"></canvas>
        <div class="globe-ring"></div>
        <div class="globe-hit"></div>
      </div>
      <div class="globe-label" id="orbLabel">TAP TO START</div>
    </div>

  </div>

  <!-- Transcript -->
  <div class="transcript-wrap">
    <div id="transcript">Listening for your command…</div>
  </div>

  <!-- No speech warning -->
  <div class="no-speech-warn" id="noSpeechWarn">
    ⚠️ Voice input not supported. Use the text box below.
  </div>

  <!-- Response -->
  <div class="response-card">
    <div class="response-header">JARVIS</div>
    <div class="response-body" id="responseBody">Systems online. How can I help you?</div>
  </div>

  <!-- Comments toggle -->
  <div class="comments-row">
    <button id="commentsToggle" class="active" onclick="toggleComments()">💬 COMMENTS: ON</button>
  </div>

  <!-- Text input -->
  <div class="input-row">
    <input class="text-input" id="textInput" type="text" placeholder="Or type a command here…"
      onkeydown="if(event.key==='Enter') sendText()">
    <button class="send-btn" onclick="sendText()">›</button>
  </div>

  <!-- History -->
  <div class="history" id="history"></div>

</main>

<script>
// ============================================================
// JARVIS — IVA Business Assistant
// ============================================================

// ── STARFIELD ────────────────────────────────────────────────
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  function resize(){ c.width = innerWidth; c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const stars = Array.from({length:200}, ()=>({
    x: Math.random(), y: Math.random(),
    r: Math.random()*1.2+0.2,
    a: Math.random()*0.6+0.2,
    speed: Math.random()*0.0003+0.0001
  }));
  let t=0;
  function draw(){
    t++;
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      const flicker = s.a*(0.7+0.3*Math.sin(t*s.speed*300+s.x*100));
      ctx.beginPath();
      ctx.arc(s.x*c.width, s.y*c.height, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,220,255,${flicker})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── ORBITAL BUTTONS ──────────────────────────────────────────
const COMMANDS = [
  { icon:'📊', text:'OVERVIEW',    sub:'Business',        cmd:'give me an overview' },
  { icon:'📋', text:'TODAY',       sub:'Leads',           cmd:'read me today leads' },
  { icon:'📞', text:'CONTACTED',   sub:'In progress',     cmd:'read me contacted leads' },
  { icon:'💰', text:'FINANCIAL',   sub:'Income/expenses', cmd:'financial overview' },
  { icon:'✅', text:'WON',         sub:'Closed deals',    cmd:'read me won leads' },
  { icon:'📅', text:'THIS WEEK',   sub:'Weekly',          cmd:'read me this week leads' },
  { icon:'👥', text:'CONTRACTORS', sub:'All agents',      cmd:'contractor performance' },
  { icon:'🔢', text:'ACTIVE',      sub:'This month',      cmd:'how many contractors this month' },
];

function buildOrbital() {
  const stage = document.getElementById('radialStage');
  const btnWrap = document.getElementById('orbitalButtons');
  const svg = document.getElementById('connectorSvg');
  const W = stage.offsetWidth || 400;
  const H = stage.offsetHeight || 400;
  const cx = W/2, cy = H/2;
  const globeR = 100; // half of 200px globe
  const orbitR = Math.min(cx, cy) * 0.82; // radius to button centres
  const n = COMMANDS.length;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  // Orbit circle path
  const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('cx', cx); circle.setAttribute('cy', cy);
  circle.setAttribute('r', orbitR);
  circle.setAttribute('fill','none');
  circle.setAttribute('stroke','rgba(212,175,55,0.06)');
  circle.setAttribute('stroke-width','1');
  circle.setAttribute('stroke-dasharray','4 8');
  svg.appendChild(circle);

  btnWrap.innerHTML = '';

  COMMANDS.forEach((cmd, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2; // start at top
    const bx = cx + orbitR * Math.cos(angle);
    const by = cy + orbitR * Math.sin(angle);

    // Connector line from globe edge to button
    const edgeX = cx + globeR * Math.cos(angle);
    const edgeY = cy + globeR * Math.sin(angle);
    const btnEdgeR = 48;
    const btnEdgeX = bx - btnEdgeR * Math.cos(angle);
    const btnEdgeY = by - btnEdgeR * Math.sin(angle);

    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', edgeX); line.setAttribute('y1', edgeY);
    line.setAttribute('x2', btnEdgeX); line.setAttribute('y2', btnEdgeY);
    line.setAttribute('stroke','rgba(212,175,55,0.12)');
    line.setAttribute('stroke-width','1');
    line.setAttribute('stroke-dasharray','3 6');
    svg.appendChild(line);

    // Dot at globe edge
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx', edgeX); dot.setAttribute('cy', edgeY);
    dot.setAttribute('r','2');
    dot.setAttribute('fill','rgba(212,175,55,0.35)');
    svg.appendChild(dot);

    // Button
    const btn = document.createElement('button');
    btn.className = 'orb-btn';
    btn.style.left = bx + 'px';
    btn.style.top  = by + 'px';
    btn.style.zIndex = '5';
    btn.innerHTML = `<span class="ob-icon">${cmd.icon}</span><span class="ob-text">${cmd.text}</span><span class="ob-sub">${cmd.sub}</span>`;
    btn.onclick = () => handleCommand(cmd.cmd);
    btnWrap.appendChild(btn);
  });
}

// Build on load and resize
window.addEventListener('load', buildOrbital);
window.addEventListener('resize', buildOrbital);

// ── PIN LOCK ─────────────────────────────────────────────────
const JARVIS_PIN = '1977';
function checkPin() {
  const val = document.getElementById('pinInput').value.trim();
  if (val === JARVIS_PIN) {
    document.getElementById('pinOverlay').style.display = 'none';
    speak("Good " + getTimeOfDay() + ". I'm Jarvis, your Iets Van Alles business assistant. How can I help you?");
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN. Try again.';
    document.getElementById('pinInput').value = '';
  }
}
document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPin(); });

// ── BACKEND ──────────────────────────────────────────────────
const JARVIS_BACKEND = 'https://script.google.com/macros/s/AKfycbwnXKSZ-cVchEdwg4FE5oY9F8N0zjZQNxcQkiyi_E7kfvruAm9yD187PMKtcZ9Kg0VbLw/exec';

function askGemini(prompt) {
  var url = JARVIS_BACKEND + '?action=askGemini&prompt=' + encodeURIComponent(prompt);
  return fetch(url, { method:'GET', redirect:'follow' })
    .then(r => r.text())
    .then(text => {
      var json = text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, '');
      try { var d = JSON.parse(json); return d.answer || d.error || 'No response.'; }
      catch(e) { return 'Could not parse response.'; }
    });
}

function callBackend(action) {
  return fetch(JARVIS_BACKEND + '?action=' + action, { method:'GET', redirect:'follow' })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(text => {
      var json = text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, '');
      try { return JSON.parse(json); } catch(e) { return JSON.parse(text); }
    });
}

// ── COMMENTS ─────────────────────────────────────────────────
var showComments = true;
function toggleComments() {
  showComments = !showComments;
  const btn = document.getElementById('commentsToggle');
  btn.textContent = '💬 COMMENTS: ' + (showComments ? 'ON' : 'OFF');
  btn.classList.toggle('active', showComments);
}

// ── CONVERSATION MODE ─────────────────────────────────────────
// conversationActive = free-flowing loop (tap to start, tap or "stop" to end)
// isListening        = mic is open right now
// isSpeaking         = TTS is playing right now
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isListening = false, isSpeaking = false;
let conversationActive = false;
let silenceTimer = null;
const SILENCE_MS = 8000; // idle timeout before loop stops

function clearSilenceTimer(){ if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; } }
function startSilenceTimer(){
  clearSilenceTimer();
  silenceTimer = setTimeout(()=>{
    if(conversationActive && !isSpeaking){
      endConversation();
      setTranscript('Conversation ended — silence timeout.',false);
    }
  }, SILENCE_MS);
}

function startConversation(){
  conversationActive = true;
  document.getElementById('orbLabel').style.color = 'var(--gold)';
  setTranscript('Conversation started. Listening…', false);
  startListeningLoop();
}

function endConversation(){
  conversationActive = false;
  clearSilenceTimer();
  isListening = false;
  if(recognition) try{ recognition.stop(); }catch(e){}
  setOrbState('idle');
  setTranscript('Tap globe to start a new conversation.',false);
}

function startListeningLoop(){
  if(!conversationActive || isSpeaking) return;
  if(!recognition) return;
  try{ recognition.start(); } catch(e){}
}

if (SpeechRec) {
  recognition = new SpeechRec();
  recognition.lang = 'en-ZA';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isListening = true;
    setOrbState('listening');
    setTranscript('Listening…', false);
    startSilenceTimer(); // start 8s countdown
  };

  recognition.onresult = e => {
    clearSilenceTimer();
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    setTranscript(final||interim, !!(final||interim));
    if(final){
      isListening = false;
      try{ recognition.stop(); }catch(e){}
      const said = final.trim();
      // Wake words to end conversation
      if(/^(stop|goodbye jarvis|bye jarvis|end conversation|stop listening|that's all jarvis|thats all jarvis)/i.test(said)){
        endConversation();
        speak("Goodbye. I'll be here when you need me.");
        return;
      }
      handleCommand(said);
    }
  };

  recognition.onerror = e => {
    isListening = false;
    clearSilenceTimer();
    if(e.error==='no-speech'){
      // Counts as silence — timer already fired or will fire
      if(conversationActive){ startSilenceTimer(); }
      else { setTranscript('No speech detected.',false); }
    } else if(e.error==='not-allowed'){
      setTranscript('Microphone blocked.',false);
      endConversation();
    } else {
      setTranscript('Error: '+e.error,false);
    }
  };

  recognition.onend = () => {
    isListening = false;
    // If conversation is still active and Jarvis isn't speaking, loop back
    if(conversationActive && !isSpeaking){
      setTimeout(startListeningLoop, 400);
    } else {
      setOrbState('idle');
    }
  };
} else {
  document.getElementById('noSpeechWarn').style.display='block';
}

// Globe tap: toggle conversation on/off
function toggleListen(){
  if(conversationActive){
    // Stop everything
    if(isSpeaking){ window.speechSynthesis.cancel(); isSpeaking=false; }
    endConversation();
  } else {
    if(isSpeaking){ window.speechSynthesis.cancel(); isSpeaking=false; }
    startConversation();
  }
}
function startListening(){ if(!recognition) return; try{ recognition.start(); }catch(e){} }
function stopListening(){ isListening=false; setOrbState('idle'); if(recognition) try{ recognition.stop(); }catch(e){} conversationActive=false; clearSilenceTimer(); }

function setOrbState(state){
  const orb = document.getElementById('orb');
  const label = document.getElementById('orbLabel');
  orb.className = 'globe-container'+(state!=='idle'?' '+state:'');
  const labels = { listening:'LISTENING…', thinking:'THINKING…', speaking:'SPEAKING…', idle: conversationActive ? 'READY…' : 'TAP TO START' };
  label.textContent = labels[state]||'TAP TO SPEAK';
  globeState = state;
}

// ── SPEECH SYNTHESIS ─────────────────────────────────────────
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  const trySpeak = () => {
    const voices = window.speechSynthesis.getVoices();
    const maleVoice =
      voices.find(v=>/google uk english male/i.test(v.name)) ||
      voices.find(v=>/daniel/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/james/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/mark/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/david/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/oliver/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>/male/i.test(v.name)&&v.lang.startsWith('en')) ||
      voices.find(v=>v.lang==='en-GB') ||
      voices.find(v=>v.lang.startsWith('en')) || null;
    if(maleVoice) utt.voice = maleVoice;
    utt.lang = maleVoice?maleVoice.lang:'en-GB';
    utt.rate=0.95; utt.pitch=0.9;
    utt.onstart=()=>{ isSpeaking=true; setOrbState('speaking'); clearSilenceTimer(); };
    utt.onend=()=>{
      isSpeaking=false;
      setOrbState('idle');
      if(conversationActive){
        // Brief pause then listen again
        setTimeout(startListeningLoop, 600);
      }
    };
    utt.onerror=()=>{
      isSpeaking=false;
      setOrbState('idle');
      if(conversationActive){ setTimeout(startListeningLoop, 600); }
    };
    window.speechSynthesis.speak(utt);
  };
  if(window.speechSynthesis.getVoices().length) trySpeak();
  else window.speechSynthesis.onvoiceschanged = trySpeak;
}

// ── GLOBE ANIMATION ──────────────────────────────────────────
var globeState = 'idle';
(function(){
  const canvas = document.getElementById('globeCanvas');
  const ctx = canvas.getContext('2d');
  const W=200, H=200, CX=W/2, CY=H/2, R=90;

  // Stars inside the globe
  const innerStars = Array.from({length:60},()=>({
    lat:(Math.random()-0.5)*Math.PI,
    lon:Math.random()*Math.PI*2,
    size:Math.random()*1.4+0.3,
    alpha:Math.random()*0.7+0.2
  }));

  // Flowing energy particles
  const particles = Array.from({length:35},()=>({
    lat:(Math.random()-0.5)*Math.PI,
    lon:Math.random()*Math.PI*2,
    speed:0.003+Math.random()*0.007,
    size:0.8+Math.random()*1.5,
    alpha:0.3+Math.random()*0.6
  }));

  // Nebula blobs
  const nebulae = Array.from({length:4},()=>({
    lat:(Math.random()-0.5)*1.2,
    lon:Math.random()*Math.PI*2,
    radius:20+Math.random()*30,
    hue:Math.random()>0.5?55:200
  }));

  let rotation=0, frame=0;

  function project(lat,lon,rot){
    const l=lon+rot;
    const x=CX+R*Math.cos(lat)*Math.sin(l);
    const y=CY-R*Math.sin(lat);
    const z=Math.cos(lat)*Math.cos(l);
    return {x,y,z};
  }

  function stateCol(){
    if(globeState==='listening') return {r:212,g:175,b:55};
    if(globeState==='thinking')  return {r:167,g:139,b:255};
    if(globeState==='speaking')  return {r:0,  g:212,b:255};
    return {r:140,g:110,b:30};
  }

  function draw(){
    frame++;
    ctx.clearRect(0,0,W,H);
    const col=stateCol();
    const cs=`${col.r},${col.g},${col.b}`;
    const rotSpeed = globeState==='idle'?0.002:globeState==='listening'?0.007:globeState==='thinking'?0.014:0.005;
    rotation+=rotSpeed;

    // Clip to sphere
    ctx.save();
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();

    // Deep space background
    const bg=ctx.createRadialGradient(CX-15,CY-15,5,CX,CY,R);
    bg.addColorStop(0,`rgba(${col.r},${col.g},${col.b},0.12)`);
    bg.addColorStop(0.4,'rgba(8,12,28,0.9)');
    bg.addColorStop(1,'rgba(2,4,12,0.97)');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // Nebula clouds
    nebulae.forEach(n=>{
      const pt=project(n.lat,n.lon,rotation);
      if(pt.z<0.1) return;
      const grd=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,n.radius*pt.z);
      grd.addColorStop(0,`hsla(${n.hue},80%,60%,${0.06*pt.z})`);
      grd.addColorStop(1,'transparent');
      ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
    });

    // Inner stars (fixed on sphere)
    innerStars.forEach(s=>{
      const pt=project(s.lat,s.lon,rotation);
      if(pt.z<0) return;
      const brightness=pt.z*s.alpha*(0.8+0.2*Math.sin(frame*0.03+s.lon));
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,s.size*Math.min(pt.z+0.2,1),0,Math.PI*2);
      ctx.fillStyle=`rgba(200,215,255,${brightness})`;
      ctx.fill();
    });

    // Lat lines (very faint)
    [-60,-30,0,30,60].forEach(deg=>{
      const lat=deg*Math.PI/180;
      const yp=CY-R*Math.sin(lat);
      const rx=R*Math.cos(lat);
      if(rx<2) return;
      ctx.beginPath();
      ctx.ellipse(CX,yp,rx,rx*0.13,0,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${cs},0.07)`; ctx.lineWidth=0.5; ctx.stroke();
    });

    // Lon lines
    for(let i=0;i<6;i++){
      const baseLon=(i/6)*Math.PI*2;
      const cosLon=Math.cos(baseLon+rotation);
      if(cosLon<-0.1) continue;
      const alpha=Math.max(0,cosLon)*0.10;
      ctx.beginPath();
      for(let s=0;s<=36;s++){
        const lat=(s/36)*Math.PI-Math.PI/2;
        const p=project(lat,baseLon,rotation);
        if(s===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.strokeStyle=`rgba(${cs},${alpha})`; ctx.lineWidth=0.5; ctx.stroke();
    }

    // Energy particles
    const pulse=globeState==='idle'?1:(1+0.5*Math.sin(frame*(globeState==='thinking'?0.18:0.10)));
    particles.forEach(p=>{
      p.lon+=p.speed*pulse;
      const pt=project(p.lat,p.lon,rotation);
      if(pt.z<0) return;
      const fade=pt.z*p.alpha;
      // Trail
      const trail=project(p.lat,p.lon-p.speed*8,rotation);
      if(trail.z>0){
        ctx.beginPath();
        ctx.moveTo(trail.x,trail.y); ctx.lineTo(pt.x,pt.y);
        ctx.strokeStyle=`rgba(${cs},${(fade*0.3).toFixed(2)})`; ctx.lineWidth=0.6; ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,p.size*(0.5+pt.z*0.5),0,Math.PI*2);
      ctx.fillStyle=`rgba(${cs},${fade.toFixed(2)})`; ctx.fill();
    });

    ctx.restore();

    // Glow rim
    const rim=ctx.createRadialGradient(CX,CY,R-8,CX,CY,R+4);
    rim.addColorStop(0,`rgba(${cs},0.0)`);
    rim.addColorStop(0.5,`rgba(${cs},${globeState==='idle'?0.08:0.22})`);
    rim.addColorStop(1,`rgba(${cs},0.0)`);
    ctx.beginPath(); ctx.arc(CX,CY,R+2,0,Math.PI*2);
    ctx.strokeStyle=rim; ctx.lineWidth=8; ctx.stroke();

    // Specular
    const spec=ctx.createRadialGradient(CX-28,CY-28,2,CX-22,CY-22,42);
    spec.addColorStop(0,'rgba(255,255,255,0.14)'); spec.addColorStop(1,'rgba(255,255,255,0)');
    ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();
    ctx.fillStyle=spec; ctx.fillRect(0,0,W,H); ctx.restore();

    requestAnimationFrame(draw);
  }
  draw();
})();

// ── HELPERS ──────────────────────────────────────────────────
function getTimeOfDay(){ const h=new Date().getHours(); return h<12?'morning':h<17?'afternoon':'evening'; }
function formatRand(val){ if(val==null||val==='') return 'R 0.00'; return 'R '+Number(val).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function setTranscript(text,hasText){ const el=document.getElementById('transcript'); el.textContent=text||'Listening for your command…'; el.className='transcript'+(hasText?' has-text':''); }
function showLoading(){ document.getElementById('responseBody').textContent='Fetching data…'; setOrbState('thinking'); }
function respond(text){ document.getElementById('responseBody').textContent=text; addHistory(document.getElementById('transcript').textContent,text); setOrbState('idle'); speak(text); }
function sendText(){ const input=document.getElementById('textInput'); const val=input.value.trim(); if(!val) return; input.value=''; setTranscript(val,true); handleCommand(val); }

function addHistory(q,a){
  if(!q||q==='Listening for your command…'||q==='Listening…') return;
  const h=document.getElementById('history');
  const div=document.createElement('div'); div.className='history-item';
  div.innerHTML='<div class="h-q">YOU SAID</div><div style="margin-bottom:6px;font-size:13px;">'+q+'</div><div class="h-q">JARVIS</div><div class="h-a">'+a.substring(0,200)+(a.length>200?'…':'')+'</div>';
  h.insertBefore(div,h.firstChild);
  if(h.children.length>5) h.removeChild(h.lastChild);
}

// ── COMMAND ROUTER ────────────────────────────────────────────
function handleCommand(text){
  const t=text.toLowerCase().trim();
  showLoading();

  if(/^(hello|hi|hey|good morning|good afternoon|good evening|howzit|hallo)/.test(t)){
    respond('Good '+getTimeOfDay()+". I'm Jarvis, your IVA business assistant. How can I help you?"); return;
  }
  if(/thank|cheers|dankie/.test(t)){ respond("You're welcome. Anything else I can help you with?"); return; }

  var needsLeads       = /lead|leed|leen|leeds|find |look up|read me|client|deal/.test(t);
  var needsContractors = /contractor|agent|ic code|who submitted|performance|active contractor|how many contractor|how many agent/.test(t);
  var needsFinancials  = /financial|finance|money|income|expense|bank|balance|spend/.test(t);
  var needsOverview    = /overview|briefing|summary|what('s| is) (happening|going on)|how are we doing/.test(t);

  if(needsLeads||needsContractors||needsFinancials||needsOverview){
    var fetches=[];
    fetches.push((needsLeads||needsOverview)?callBackend('getLeads').catch(()=>null):Promise.resolve(null));
    fetches.push((needsContractors||needsOverview)?callBackend('getContractors').catch(()=>null):Promise.resolve(null));
    fetches.push((needsFinancials||needsOverview)?callBackend('getSummary').catch(()=>null):Promise.resolve(null));

    Promise.all(fetches).then(function(results){
      var leadsData=results[0], ctData=results[1], finData=results[2];
      var today=new Date().toDateString();
      var context='You are Jarvis, a professional British male AI business assistant for Iets Van Alles, a South African used heavy vehicle and machinery brokerage. '+
        'Be concise, clear and professional. Speak in first person as Jarvis. Do not use markdown or bullet symbols — plain spoken sentences only. '+
        'Today is '+today+'.\n\n';
      if(leadsData&&!leadsData.error){
        var leads=leadsData.leads||[];
        var st={new:0,contacted:0,won:0,lost:0};
        leads.forEach(l=>{ var s=(l.status||'new').toLowerCase(); if(st[s]!==undefined) st[s]++; });
        context+='LEADS DATA: Total: '+leadsData.total+'. New:'+st.new+', Contacted:'+st.contacted+', Won:'+st.won+', Lost:'+st.lost+'.\n';
        context+='Recent: '+leads.slice(0,10).map(l=>l.clientName+'('+l.status+','+l.timestamp+',IC:'+l.icCode+')').join(' | ')+'\n\n';
      }
      if(ctData&&!ctData.error){
        var cts=ctData.contractors||[];
        context+='CONTRACTORS: '+cts.length+' total. '+cts.slice(0,10).map(c=>c.name+'('+c.icCode+'):'+c.total+' leads,won:'+c.won+',last:'+c.lastLeadDate).join(' | ')+'\n\n';
      }
      if(finData&&finData.summary){
        var s=finData.summary;
        context+='FINANCIALS: Period:'+s.period+'. Income:R'+s.income+', Expenses:R'+s.expenses+', Balance:R'+s.closingBalance+'\n\n';
      }
      context+='USER QUESTION: '+text;
      return askGemini(context);
    }).then(answer=>respond(answer)).catch(err=>respond('Problem fetching data: '+err.message));
  } else {
    var prompt='You are Jarvis, a professional British male AI assistant. Be concise and spoken — no markdown, no bullet symbols. Answer: '+text;
    askGemini(prompt).then(answer=>respond(answer)).catch(err=>respond('I could not reach the AI: '+err.message));
  }
}

// ── CONTRACTORS ───────────────────────────────────────────────
function cmdContractors(t){
  showLoading();
  callBackend('getContractors').then(function(data){
    if(data.error){ respond('Could not read contractor data: '+data.error); return; }
    var contractors=data.contractors||[];
    if(!contractors.length){ respond('No contractor data found.'); return; }
    var now2=new Date(), sinceMs=null, sinceLabel2='';
    if(/2 month|two month/.test(t)){sinceMs=now2.getTime()-60*24*60*60*1000;sinceLabel2='the last 2 months';}
    else if(/3 month|three month/.test(t)){sinceMs=now2.getTime()-90*24*60*60*1000;sinceLabel2='the last 3 months';}
    else if(/6 month|six month/.test(t)){sinceMs=now2.getTime()-180*24*60*60*1000;sinceLabel2='the last 6 months';}
    else if(/this month/.test(t)){var d=new Date(now2.getFullYear(),now2.getMonth(),1);sinceMs=d.getTime();sinceLabel2='this month';}
    else if(/last month/.test(t)){var d=new Date(now2.getFullYear(),now2.getMonth()-1,1);sinceMs=d.getTime();sinceLabel2='last month';}
    else if(/this week/.test(t)){var d=new Date(now2);d.setDate(d.getDate()-((d.getDay()+6)%7));sinceMs=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();sinceLabel2='this week';}
    else if(/today/.test(t)){var d=new Date(now2.getFullYear(),now2.getMonth(),now2.getDate());sinceMs=d.getTime();sinceLabel2='today';}
    if(/how many|count|active|who submitted|who put in/.test(t)&&!/for [a-z]/.test(t)){
      var period=sinceMs||(now2.getTime()-30*24*60*60*1000);
      var label=sinceLabel2||'the last 30 days';
      var active=contractors.filter(c=>c.leads.some(l=>new Date(l.timestamp).getTime()>=period));
      respond(active.length+' contractor'+(active.length!==1?'s':'')+' submitted leads in '+label+', out of '+contractors.length+' on the system.\n\n'+
        active.map(c=>{var cnt=c.leads.filter(l=>new Date(l.timestamp).getTime()>=period).length; return c.name+' ('+c.icCode+'): '+cnt+' lead'+(cnt!==1?'s':'');}).join('\n'));
      return;
    }
    var nm=t.match(/(?:for|how is|how did|show me)\s+([a-z]+(?: [a-z]+)?)/i);
    if(nm){
      var cand=nm[1].toLowerCase().trim();
      if(!/^(all|this|last|the|a|an|of|in|week|month|today|performance|contractor|agent|me)$/.test(cand)){
        var found=contractors.filter(c=>c.name.toLowerCase().indexOf(cand)!==-1||c.icCode.toLowerCase().indexOf(cand)!==-1);
        if(!found.length){ respond('No contractor found matching "'+cand+'".'); return; }
        respond(found.map(c=>c.name+' (IC: '+c.icCode+'):\n  Total: '+c.total+' leads\n  New: '+c.new+', Contacted: '+c.contacted+', Won: '+c.won+', Lost: '+c.lost+(c.lastLeadDate?'\n  Last lead: '+c.lastLeadDate:'')).join('\n\n'));
        return;
      }
    }
    var top=contractors.slice(0,8);
    respond('Contractor performance — '+contractors.length+' on system.\n\n'+top.map((c,i)=>(i+1)+'. '+c.name+': '+c.total+' leads — Won:'+c.won+', Contacted:'+c.contacted+', New:'+c.new).join('\n'));
  }).catch(err=>respond('Could not reach contractor data: '+err.message));
}
